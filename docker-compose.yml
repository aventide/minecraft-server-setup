services:
    minecraft-server:
        image: itzg/minecraft-server:latest
        restart: unless-stopped
        ports:
            - "25565:25565"
        volumes:
            - ./minecraft-data:/data

        environment:
            EULA: "TRUE"
            ENABLE_RCON: "true"
            RCON_PORT: 25575
            RCON_PASSWORD: ${RCON_PASSWORD:?RCON_PASSWORD is required}

    minecraft-data-backup:
        image: itzg/mc-backup:latest
        restart: unless-stopped
        depends_on:
            - minecraft-server
        volumes:
            - ./minecraft-data:/data:ro
            - ./config:/config

        environment:
            RCON_HOST: minecraft-server
            RCON_PORT: 25575
            RCON_PASSWORD: ${RCON_PASSWORD:?RCON_PASSWORD is required}
            RCON_RETRIES: 30
            RCON_RETRY_INTERVAL: 10s
            BACKUP_ON_STARTUP: "true"
            BACKUP_INTERVAL: 24h
            PRUNE_BACKUPS_COUNT: 15
            BACKUP_METHOD: rclone
            RCLONE_REMOTE: gdrive
            RCLONE_DEST_DIR: "Backups/Minecraft Daily Backups"
            EXCLUDES: "*.jar,cache,*.tmp"
            INITIAL_DELAY: 2m

    ddns-updater:
        image: docker.io/qmcgaw/ddns-updater:latest
        restart: unless-stopped

        environment:
            TZ: ${TZ}
            CONFIG: >
                {"settings":[{"provider":"noip","domain":"${NOIP_HOSTNAMES:?NOIP_HOSTNAMES is required}","username":"${NOIP_USERNAME:?NOIP_USERNAME is required}","password":"${NOIP_PASSWORD:?NOIP_PASSWORD is required}"}]}
